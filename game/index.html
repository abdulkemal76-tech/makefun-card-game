<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tide Market — a card duel on a rising tide</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Tide Market: a card duel in a floating night market. Sell cards, buy the catch of the day, haggle, and reach 21 coins before Madam Coral."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
